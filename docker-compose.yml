version: "3.8"
services:
  weekdataback:
    build: .
    container_name: weekdataback
    # Use Docker secrets instead of .env (create files under ./secrets/)
    secrets:
      - PGHOST
      - PGUSER
      - PGPASSWORD
      - PGDATABASE
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_DEFAULT_REGION
    environment:
      - BACKUP_DIR=/backups
      - PGPORT=5432
      - KEEP=4
      - S3_BUCKET=
      - S3_PATH=
      - S3_DELETE_LOCAL_AFTER_UPLOAD=false
    volumes:
      - ./backups:/backups
      - ./backup.log:/var/log/backup.log
    restart: unless-stopped

secrets:
  PGHOST:
    file: ./secrets/PGHOST
  PGUSER:
    file: ./secrets/PGUSER
  PGPASSWORD:
    file: ./secrets/PGPASSWORD
  PGDATABASE:
    file: ./secrets/PGDATABASE
  AWS_ACCESS_KEY_ID:
    file: ./secrets/AWS_ACCESS_KEY_ID
  AWS_SECRET_ACCESS_KEY:
    file: ./secrets/AWS_SECRET_ACCESS_KEY
  AWS_DEFAULT_REGION:
    file: ./secrets/AWS_DEFAULT_REGION
